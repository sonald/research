env:
  max_episode_steps: 1000
  reward:
    survival_reward: 0.05
    invalid_action_penalty: -0.05
    terminal_penalty: -5.0
    height_penalty: 0.02
    hole_penalty: 0.08
    bumpiness_penalty: 0.03
    line_clear_rewards: [1.0, 3.0, 5.0, 8.0]

train:
  seed: 42
  total_steps: 20000
  log_interval: 500
  checkpoint_interval: 2000
  output_dir: "outputs/baseline_dqn"
  eval_episodes: 5

dqn:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 64
  replay_size: 50000
  warmup_steps: 2000
  target_update_interval: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 20000
  hidden_dim: 256
  train_frequency: 1
  gradient_clip_norm: 10.0
