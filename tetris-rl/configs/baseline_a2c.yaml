env:
  max_episode_steps: 1000
  reward:
    survival_reward: 0.05
    invalid_action_penalty: -0.05
    terminal_penalty: -5.0
    height_penalty: 0.02
    hole_penalty: 0.08
    bumpiness_penalty: 0.03
    line_clear_rewards: [1.0, 3.0, 5.0, 8.0]

train:
  seed: 42
  total_steps: 20000
  log_interval: 500
  checkpoint_interval: 2000
  output_dir: "outputs/baseline_a2c"
  eval_episodes: 5

a2c:
  learning_rate: 0.00025
  gamma: 0.99
  num_envs: 8
  n_steps: 5
  entropy_coef: 0.01
  value_coef: 0.5
  hidden_dim: 256
  gradient_clip_norm: 0.5
