env:
  max_episode_steps: 200
  reward:
    survival_reward: 0.02
    invalid_action_penalty: -0.03
    terminal_penalty: -2.0

train:
  seed: 11
  total_steps: 512
  log_interval: 128
  checkpoint_interval: 256
  output_dir: "outputs/debug_a2c"
  eval_episodes: 2

a2c:
  learning_rate: 0.00025
  gamma: 0.99
  num_envs: 4
  n_steps: 4
  entropy_coef: 0.01
  value_coef: 0.5
  hidden_dim: 128
  gradient_clip_norm: 0.5
