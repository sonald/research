env:
  max_episode_steps: 200
  reward:
    survival_reward: 0.02
    invalid_action_penalty: -0.03
    terminal_penalty: -2.0

train:
  seed: 7
  total_steps: 512
  log_interval: 128
  checkpoint_interval: 256
  output_dir: "outputs/debug_dqn"
  eval_episodes: 2

dqn:
  learning_rate: 0.0001
  gamma: 0.99
  batch_size: 32
  replay_size: 2048
  warmup_steps: 64
  target_update_interval: 128
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_steps: 512
  hidden_dim: 128
  train_frequency: 1
  gradient_clip_norm: 5.0
