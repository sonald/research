env:
  max_episode_steps: 2000
train:
  seed: 42
  total_steps: 100000
  log_interval: 2000
  checkpoint_interval: 10000
  output_dir: outputs/baseline_dqn
  eval_episodes: 5
dqn:
  learning_rate: 0.0003
  batch_size: 128
  replay_size: 100000
  warmup_steps: 2000
  target_update_interval: 1000
  epsilon_decay_steps: 50000
  hidden_dim: 256
