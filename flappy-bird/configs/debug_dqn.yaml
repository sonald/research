env:
  max_episode_steps: 300
train:
  seed: 7
  total_steps: 2000
  log_interval: 250
  checkpoint_interval: 1000
  output_dir: outputs/debug_dqn
  eval_episodes: 3
dqn:
  learning_rate: 0.0005
  batch_size: 32
  replay_size: 5000
  warmup_steps: 128
  target_update_interval: 200
  epsilon_decay_steps: 2000
  hidden_dim: 128
