[project]
name = "mini-act-checkpointing"
version = "0.1.0"
description = "A learn-by-doing activation checkpointing implementation and Chinese interactive tutorial."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mini-act-checkpointing-demo = "mini_act_checkpointing.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_act_checkpointing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
